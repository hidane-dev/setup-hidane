name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck setup.sh migrate/*.sh test/*.sh
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v$VERSION/$archive"
          echo "$SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" actionlint
          ./actionlint -color

  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "version=$(gh api repos/hidane-dev/hidane/releases/latest --jq '.tag_name | ltrimstr("v")')" >> "$GITHUB_OUTPUT"

      - name: Install the latest release
        id: latest
        uses: ./
      - name: Check
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_CACHE_HIT: "false"
          VERSION: ${{ steps.latest.outputs.version }}
          BIN: ${{ steps.latest.outputs.path }}
          CACHE_HIT: ${{ steps.latest.outputs.cache-hit }}
        run: bash test/check.sh

      - name: Install 0.3.0
        id: pinned
        uses: ./
        with:
          version: 0.3.0
      - name: Check
        env:
          EXPECTED_VERSION: 0.3.0
          VERSION: ${{ steps.pinned.outputs.version }}
          BIN: ${{ steps.pinned.outputs.path }}
          CACHE_HIT: ${{ steps.pinned.outputs.cache-hit }}
        run: bash test/check.sh

      # The same version again, written with a v: from the tool cache, verified again.
      - name: Install v0.3.0 again
        id: cached
        uses: ./
        with:
          version: v0.3.0
      - name: Check
        env:
          EXPECTED_VERSION: 0.3.0
          EXPECTED_CACHE_HIT: "true"
          VERSION: ${{ steps.cached.outputs.version }}
          BIN: ${{ steps.cached.outputs.path }}
          CACHE_HIT: ${{ steps.cached.outputs.cache-hit }}
        run: bash test/check.sh

      - name: Install without the attestation check
        id: unattested
        uses: ./
        with:
          version: 0.3.0
          verify-attestation: false
      - name: Check
        env:
          EXPECTED_VERSION: 0.3.0
          VERSION: ${{ steps.unattested.outputs.version }}
          BIN: ${{ steps.unattested.outputs.path }}
          CACHE_HIT: ${{ steps.unattested.outputs.cache-hit }}
        run: bash test/check.sh

      # Inputs that must be refused.
      - name: A malformed version
        id: malformed
        continue-on-error: true
        uses: ./
        with:
          version: 0.3.0; echo injected
      - name: A version that was never released
        id: unreleased
        continue-on-error: true
        uses: ./
        with:
          version: 0.0.0
      - name: A malformed verify-attestation
        id: malformed-verify
        continue-on-error: true
        uses: ./
        with:
          verify-attestation: maybe
      - name: Check the refusals
        env:
          MALFORMED: ${{ steps.malformed.outcome }}
          UNRELEASED: ${{ steps.unreleased.outcome }}
          MALFORMED_VERIFY: ${{ steps.malformed-verify.outcome }}
        run: |
          echo "malformed version: $MALFORMED, unreleased version: $UNRELEASED, malformed verify-attestation: $MALFORMED_VERIFY"
          [[ $MALFORMED == failure && $UNRELEASED == failure && $MALFORMED_VERIFY == failure ]]

  # The workflow token with no permissions at all: the action reads public data only.
  no-permissions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: hidane
        uses: ./
      - name: Check
        env:
          EXPECTED_VERSION: ${{ steps.hidane.outputs.version }}
          VERSION: ${{ steps.hidane.outputs.version }}
          BIN: ${{ steps.hidane.outputs.path }}
          CACHE_HIT: ${{ steps.hidane.outputs.cache-hit }}
        run: bash test/check.sh

  # The README's example: firebase-tools from a project's devDependencies, through hidane exec.
  emulators-exec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FIREBASE_TOOLS: 15.33.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
      - name: A project with firebase-tools
        working-directory: ${{ runner.temp }}
        run: |
          mkdir project
          cd project
          echo '{ "emulators": { "firestore": { "port": 8080 }, "ui": { "enabled": false } } }' > firebase.json
          npm init --yes > /dev/null
          npm install --save-dev --no-audit --no-fund "firebase-tools@$FIREBASE_TOOLS"
      - name: hidane exec -- firebase emulators:exec
        working-directory: ${{ runner.temp }}/project
        run: |
          hidane exec -- npx firebase emulators:exec --only firestore --project demo-setup-hidane \
            "bash '$GITHUB_WORKSPACE/test/write-read.sh'"
          # hidane served the emulator: firebase-tools did not download the official jar.
          if ls ~/.cache/firebase/emulators/cloud-firestore-emulator-*.jar 2>/dev/null; then
            echo "::error::firebase-tools downloaded the official emulator"
            exit 1
          fi

  # The README's other example: hidane started in the background in one step, used in the next.
  background:
    name: background (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
      - name: Start hidane
        run: |
          hidane --host 127.0.0.1 --port 8080 > "$RUNNER_TEMP/hidane.log" 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/
      - name: Write and read
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: bash test/write-read.sh
      - name: Stop hidane
        if: always()
        run: |
          curl -fsS -X POST http://127.0.0.1:8080/shutdown || true
          cat "$RUNNER_TEMP/hidane.log"

  # The migrate sub-action, on fixture repositories made in the job, each with a bare repository as
  # origin: dry runs, which commit on a local branch and push nothing, and the inputs and states it
  # must refuse. The first dry run installs hidane 0.5.0, the first release with `hidane migrate`,
  # through the action's hidane-version input; the later steps use it from PATH.
  migrate:
    name: migrate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fixtures
        run: |
          for state in official hidane dirty; do
            bash test/migrate-fixture.sh "$RUNNER_TEMP/$state" "$state"
          done
          bash test/migrate-fixture.sh "$RUNNER_TEMP/push" official
          # The branch the action would create, already on origin.
          bash test/migrate-fixture.sh "$RUNNER_TEMP/existing" official
          project="$RUNNER_TEMP/existing/project"
          git -C "$project" push --quiet origin "HEAD:refs/heads/hidane/migrate-$(git -C "$project" rev-parse HEAD | cut -c 1-7)"

      - name: Dry run
        id: dry-run
        uses: ./migrate
        with:
          path: ${{ runner.temp }}/official/project
          hidane-version: 0.5.0
          dry-run: true
      - name: Check
        env:
          PROJECT: ${{ runner.temp }}/official/project
          EXPECTED: changed
          CHANGED: ${{ steps.dry-run.outputs.changed }}
          BRANCH: ${{ steps.dry-run.outputs.branch }}
          COMMIT: ${{ steps.dry-run.outputs.commit }}
          PULL_REQUEST_URL: ${{ steps.dry-run.outputs.pull-request-url }}
          BODY_FILE: ${{ steps.dry-run.outputs.body-file }}
          PLAN_FILE: ${{ steps.dry-run.outputs.plan-file }}
          HIDANE_VERSION: ${{ steps.dry-run.outputs.hidane-version }}
        run: bash test/migrate-check.sh

      # A project already moved to hidane: hidane migrate finds nothing, and the action stops.
      - name: Nothing to change
        id: unchanged
        uses: ./migrate
        with:
          path: ${{ runner.temp }}/hidane/project
          hidane-version: installed
          dry-run: true
      - name: Check
        env:
          PROJECT: ${{ runner.temp }}/hidane/project
          EXPECTED: unchanged
          CHANGED: ${{ steps.unchanged.outputs.changed }}
          BRANCH: ${{ steps.unchanged.outputs.branch }}
          COMMIT: ${{ steps.unchanged.outputs.commit }}
          PULL_REQUEST_URL: ${{ steps.unchanged.outputs.pull-request-url }}
          BODY_FILE: ${{ steps.unchanged.outputs.body-file }}
          PLAN_FILE: ${{ steps.unchanged.outputs.plan-file }}
          HIDANE_VERSION: ${{ steps.unchanged.outputs.hidane-version }}
        run: bash test/migrate-check.sh

      # What must be refused.
      - name: Uncommitted changes
        id: dirty
        continue-on-error: true
        uses: ./migrate
        with:
          path: ${{ runner.temp }}/dirty/project
          hidane-version: installed
          dry-run: true
      - name: A branch that exists on origin
        id: existing
        continue-on-error: true
        uses: ./migrate
        with:
          path: ${{ runner.temp }}/existing/project
          hidane-version: installed
          dry-run: true
      - name: A malformed branch
        id: malformed-branch
        continue-on-error: true
        uses: ./migrate
        with:
          path: ${{ runner.temp }}/hidane/project
          hidane-version: installed
          dry-run: true
          branch: hidane/migrate..$(echo injected)
      - name: A malformed draft
        id: malformed-draft
        continue-on-error: true
        uses: ./migrate
        with:
          path: ${{ runner.temp }}/hidane/project
          hidane-version: installed
          dry-run: true
          draft: maybe
      # Outside workflow_dispatch, nothing is pushed. When this workflow is started by hand, the
      # changes to .github/workflows/ with the workflow's token are refused instead.
      - name: A push outside workflow_dispatch
        id: push
        continue-on-error: true
        uses: ./migrate
        with:
          path: ${{ runner.temp }}/push/project
          hidane-version: installed
      # Last: it puts hidane 0.4.0 on PATH.
      - name: hidane 0.4.0, which has no hidane migrate
        id: old
        continue-on-error: true
        uses: ./migrate
        with:
          path: ${{ runner.temp }}/hidane/project
          hidane-version: 0.4.0
          dry-run: true
      - name: Check the refusals
        env:
          DIRTY: ${{ steps.dirty.outcome }}
          EXISTING: ${{ steps.existing.outcome }}
          MALFORMED_BRANCH: ${{ steps.malformed-branch.outcome }}
          MALFORMED_DRAFT: ${{ steps.malformed-draft.outcome }}
          PUSH: ${{ steps.push.outcome }}
          OLD: ${{ steps.old.outcome }}
        run: |
          echo "uncommitted changes: $DIRTY, existing branch: $EXISTING, malformed branch: $MALFORMED_BRANCH, malformed draft: $MALFORMED_DRAFT, push: $PUSH, hidane 0.4.0: $OLD"
          [[ $DIRTY == failure && $EXISTING == failure && $MALFORMED_BRANCH == failure && $MALFORMED_DRAFT == failure && $PUSH == failure && $OLD == failure ]]
          # Nothing reached an origin but the branch the fixture put there.
          for state in official hidane dirty push; do
            [[ $(git -C "$RUNNER_TEMP/$state/origin.git" for-each-ref --format='%(refname)' refs/heads) == refs/heads/main ]]
          done
